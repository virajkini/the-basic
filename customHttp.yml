customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.amgeljodi.com; font-src 'self'; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com https://amgeljodi.com https://www.amgeljodi.com https://app.amgeljodi.com https://api.amgeljodi.com; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'camera=(), microphone=(), geolocation=()'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
