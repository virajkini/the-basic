applications:
  - appRoot: client/amgel-jodi-home
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'Content-Security-Policy'
            value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://static.amgeljodi.com; font-src 'self'; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com https://amgeljodi.com https://www.amgeljodi.com https://app.amgeljodi.com https://api.amgeljodi.com https://accounts.google.com https://play.google.com https://static.amgeljodi.com; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';"
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'Permissions-Policy'
            value: 'camera=(), microphone=(), geolocation=()'
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
  - appRoot: client/amgel-jodi-app
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: 'X-Frame-Options'
            value: 'DENY'
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'Referrer-Policy'
            value: 'strict-origin-when-cross-origin'
          - key: 'Strict-Transport-Security'
            value: 'max-age=31536000; includeSubDomains'
